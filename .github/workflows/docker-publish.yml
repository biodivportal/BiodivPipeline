name: Publish module images to GHCR

# Builds and pushes the Docker image for any in-repo module whose source lives
# under modules/local/<module>/ (i.e. the module ships a Dockerfile here rather
# than in a separate team repo). Images are published to the project GHCR
# namespace, properly tagged.
#
# Add a new in-repo module by appending an entry to the matrix below.
#
# Tags produced (via docker/metadata-action):
#   - the module's pinned version (e.g. :0.1) — always, so `container` refs resolve
#   - :latest                                 — on the default branch only
#   - :sha-<short>                            — immutable, every build
#   - :<semver>                               — when a git tag like v0.1.0 is pushed
#
# Images are multi-arch (linux/amd64,linux/arm64) so the pipeline runs natively
# on both Intel and Apple Silicon without the emulate_amd64 workaround.
#
# NOTE: a newly created package may default to private. After the first publish,
# set the package visibility to Public once in the package settings so the
# pipeline can pull it without authentication.

on:
  push:
    branches: [main, master, dev]
    tags: ["v*.*.*"]
    paths:
      - "modules/local/taxonomy_classify/**"
      - "modules/local/outlier_detect/**"
      - "modules/local/provisional_concepts/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: biodivportal

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: taxonomy-classify
            context: modules/local/taxonomy_classify
            version: "0.1"
          - module: outlier-detect
            context: modules/local/outlier_detect
            version: "0.1"
          - module: provisional-concepts
            context: modules/local/provisional_concepts/bin
            version: "0.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.module }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
