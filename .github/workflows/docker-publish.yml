name: Publish module images to GHCR

# Builds and pushes the Docker image for any in-repo module whose source lives
# under modules/local/<module>/ (i.e. the module ships a Dockerfile here rather
# than in a separate team repo). Images are published to the project GHCR
# namespace, properly tagged.
#
# Add a new in-repo module by appending an entry to the matrix below.
#
# Tags produced (via docker/metadata-action):
#   - the module's pinned version (e.g. :0.1) — always, so `container` refs resolve
#   - :latest                                 — on the default branch only
#   - :sha-<short>                            — immutable, every build
#   - :<semver>                               — when a git tag like v0.1.0 is pushed
#
# Images are multi-arch (linux/amd64,linux/arm64) so the pipeline runs natively
# on both Intel and Apple Silicon without the emulate_amd64 workaround.
#
# NOTE: a newly created package may default to private. After the first publish,
# set the package visibility to Public once in the package settings so the
# pipeline can pull it without authentication.

on:
  push:
    branches: [main, master, dev]
    tags: ["v*.*.*"]
    paths:
      - "modules/local/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: biodivportal

jobs:
  # Detect which in-repo modules changed and emit a build matrix so we only
  # (re)publish images whose source actually changed. Manual runs
  # (workflow_dispatch) and tag pushes rebuild every module.
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_changes: ${{ steps.set.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed module paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            column-standardise: 'modules/local/column_standardise/**'
            biodiv-annotate: 'modules/local/biodiv_annotate/**'
            taxonomy-classify: 'modules/local/taxonomy_classify/**'
            outlier-detect: 'modules/local/outlier_detect/**'
            provisional-concepts: 'modules/local/provisional_concepts/**'
            assemble-dataset: 'modules/local/assemble_dataset/**'
            collect-reports: 'modules/local/collect_reports/**'
            rdf-matching-and-transformation-service: 'modules/local/rdf_transform/**'

      - name: Build matrix from changed modules
        id: set
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import json, os, re

          # image name -> build context + the main.nf that declares the container
          # tag. The tag in main.nf is the single source of truth for the version.
          MODULES = {
              "column-standardise":                      {"context": "modules/local/column_standardise",       "main": "modules/local/column_standardise/main.nf"},
              "biodiv-annotate":                         {"context": "modules/local/biodiv_annotate",          "main": "modules/local/biodiv_annotate/main.nf"},
              "taxonomy-classify":                       {"context": "modules/local/taxonomy_classify",        "main": "modules/local/taxonomy_classify/main.nf"},
              "outlier-detect":                          {"context": "modules/local/outlier_detect",           "main": "modules/local/outlier_detect/main.nf"},
              "provisional-concepts":                    {"context": "modules/local/provisional_concepts/bin", "main": "modules/local/provisional_concepts/main.nf"},
              "assemble-dataset":                        {"context": "modules/local/assemble_dataset",         "main": "modules/local/assemble_dataset/main.nf"},
              "collect-reports":                         {"context": "modules/local/collect_reports",          "main": "modules/local/collect_reports/main.nf"},
              "rdf-matching-and-transformation-service": {"context": "modules/local/rdf_transform",             "main": "modules/local/rdf_transform/nextflow/main.nf"},
          }

          def tag_for(image, main):
              txt = open(main).read()
              m = re.search(r"ghcr\.io/biodivportal/" + re.escape(image) + r":([A-Za-z0-9._-]+)", txt)
              if not m:
                  raise SystemExit(f"::error::no container tag found for {image} in {main}")
              return m.group(1)

          # Rebuild everything on a manual dispatch or a tag; otherwise only changed.
          if os.environ["EVENT"] == "workflow_dispatch" or os.environ.get("REF_TYPE") == "tag":
              changed = list(MODULES)
          else:
              changed = json.loads(os.environ.get("CHANGED") or "[]")

          include = [
              {"module": m, "context": MODULES[m]["context"], "version": tag_for(m, MODULES[m]["main"])}
              for m in changed if m in MODULES
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")
              f.write("has_changes=" + ("true" if include else "false") + "\n")
          PY

  build-and-push:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.module }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
