name: Build Service Image

# ⚠️ MONOREPO NOTE: This workflow only runs when this module lives in its OWN
# repository (named `rdf-matching-and-transformation-service`). GitHub Actions
# only discovers workflows under the repository-root `.github/workflows/` — a
# copy nested at `modules/local/rdf_transform/.github/workflows/` inside the
# BiodivPipeline monorepo is NEVER triggered. Two things also assume the
# standalone repo and would need fixing if you move this to the monorepo root:
#   - `github.repository` would resolve to `<owner>/BiodivPipeline`, so the
#     image would publish as `ghcr.io/<owner>/biodivpipeline`, not the
#     `…/rdf-matching-and-transformation-service` name that the README and
#     nextflow/main.nf pull from.
#   - `context: .` below would point at the monorepo root, not this module dir,
#     so the Dockerfile would not be found.
# Keep building the image from the standalone repo, or adapt all three before
# relocating this file.
#
# Build + publish the runtime service image (FastAPI + Morph-KGC +
# OBOE ontology) to GitHub Container Registry. Consumed by:
#   - the nf-core module under nextflow/main.nf
#   - any other pipeline that wants to talk to the WP8 service
#
# Manual-only trigger (workflow_dispatch). Tag the release with a
# semantic version like `0.1.0`; the workflow publishes both
# `ghcr.io/<owner>/<repo>:vX.Y.Z` (immutable) and `:latest`
# (floating alias) so consumers can pin or follow the head.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version for this release (e.g. 0.1.0). Will be published as v<version> + :latest.'
        required: true
        default: '0.1.0'

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase repo)
        id: img
        run: |
          repo="${{ github.repository }}"
          echo "name=ghcr.io/${repo,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # Pure-Python image — no build args, no Maven/JVM. The Dockerfile
          # just pip-installs Morph-KGC and the FastAPI app.
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:v${{ github.event.inputs.version }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
